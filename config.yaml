# =============================================================================
# BCI real-time protocol — configuração principal
# =============================================================================
# Uso normal:
#   1) ajuste sujeito/sessão;
#   2) escolha protocol.stage;
#   3) execute "BCI: conduzir experimento" no VS Code (F5).
#
# ETAPA 1 — single_target
#   EM_treino -> IM_treino -> online target bloco 1 -> bloco 2
#   Modelo: perna-alvo vs REST_STIM
#
# ETAPA 2 — two_legs
#   EM_treino -> IM_treino -> online bloco 1 -> bloco 2
#   Modelo: LEFT vs RIGHT vs REST_STIM
#
# As duas etapas têm exatamente a mesma sequência. O que muda é somente
# quais classes entram no modelo/controle online. Para passar de uma etapa
# para a outra, troque stage e rode main.py novamente.
# =============================================================================

# #############################################################################
# PARÂMETROS PRINCIPAIS
# #############################################################################

experiment:
  subject_id    : "TEST"
  session_id    : 1
  exp_name      : "TEST"
  session_type  : "IM_treino"   # o main altera conforme a fase
  log_root      : "Dados"

runtime:
  source           : eego        # null usa simulate_signal; simulator | hiamp | eego | lsl
  simulate_signal  : true        # true = simulação; false = g.HIamp

protocol:
  stage          : "single_target"  # single_target | two_legs
  start_phase    : "auto"              # auto | execution | imagery | online

  # Usado somente em single_target.
  online_target  : "right"          # left | right

  # auto resolve conforme stage:
  #   single_target -> target_vs_rest
  #   two_legs      -> left_right_vs_rest
  training_mode  : "auto"

  block_end_code       : 99
  block_end_label      : "BLOCK_END"
  motor_session_type   : "EM_treino"
  imagery_session_type : "IM_treino"

  # Online da ETAPA 1. PCA é mostrado somente ao experimentador nos dois blocos.
  online_modes_single_target:
    - name          : "target_feedback"
      label         : "Online target — bloco 1"
      session_type  : "IM_online_target_PCA"

    - name          : "target_no_feedback"
      label         : "Online target — bloco 2"
      session_type  : "IM_online_target_sem_feedback"

  # Online da ETAPA 2 — mesma sequência da etapa 1.
  online_modes_two_legs:
    - name          : "two_legs_feedback"
      label         : "Online duas pernas — bloco 1"
      session_type  : "IM_online_duas_pernas_PCA"

    - name          : "two_legs_no_feedback"
      label         : "Online duas pernas — bloco 2"
      session_type  : "IM_online_duas_pernas_sem_feedback"

  # 15 tentativas por classe = 45 trials, como os 3 ciclos antigos de 5.
  trials_per_class : 15
  baseline_s       : 3.0
  attention_s      : 2.0
  cue_s            : 1.25
  rest_s           : 2.0
  startup_timeout_s: 30.0
  signal_stall_s   : 3.0

  min_cv_accuracy      : null

# #############################################################################
# CONFIGURAÇÕES TÉCNICAS / AVANÇADAS
# #############################################################################

lsl:
  marker_name   : "GrazMI_Markers"
  marker_type   : "Markers"
  signal_name   : "gHIamp_EEG"
  signal_type   : "EEG"
  decoder_name  : "Signal"
  decoder_type  : "BCI"

fs_hz                    : 256.0
n_channels               : 16
trial_duration_s         : 3.75
trial_offset_s           : 0.0
window_s                 : 1.0
step_s                   : 0.05
filter_mode              : "causal"
bp_order                 : 3
bp_band_hz               : [5.0, 40.0]
select_by                : "index"
index_base               : 1
select_channels          : []
feature_space            : "riemann"
classifier               : "svm_linear"
pca_dim                  : 2
svc_c                    : 1.0
cv_splits                : 5
rng_seed                 : 42
decoder_outlet_name      : "Signal"
decoder_outlet_type      : "BCI"

representation_feedback:
  pad_frac        : 0.10
  grid_size       : 240
  density_masses  : [0.50, 0.80, 0.95]
  show_labels     : true

# Signal / BCI publica sempre:
# [rep1, rep2, p_left, p_rest, p_right, active_left, active_rest, active_right]
# GrazMI_Control continua sendo a camada exclusiva de movimento do avatar.
control:
  enabled                     : true
  outlet_name                 : "GrazMI_Control"
  outlet_type                 : "BCIControl"
  enter_persist_s             : 0.10
  exit_persist_s              : 0.10
  min_probability             : 0.40
  min_probability_margin      : 0.05
  movement_rise_s             : 1.00
  movement_fall_s             : 0.80
  output_rate_hz              : 60.0
  decoder_stale_s             : 0.60


# Sinal simulado. REST_STIM = ruído/basal, sem burst motor.
sim_chunk             : 10
sim_noise_std         : 0.8
sim_burst_freq_hz     : 10.0
sim_burst_amp         : 1.5
sim_taper_frac        : 0.2
sim_profile_left_mi   : [1.0, 0.3]
sim_profile_right_mi  : [0.3, 1.0]

# Marcadores do protocolo.
# REST (6) = pausa intertrial; REST_STIM (8) = condição experimental.
codes:
  left_mi    : 3
  right_mi   : 4
  rest_stim  : 8
  attempt    : 5
  block_end  : 99
  map:
    "1"  : "BASELINE"
    "2"  : "ATTENTION"
    "3"  : "LEFT_MI_STIM"
    "4"  : "RIGHT_MI_STIM"
    "5"  : "ATTEMPT"
    "6"  : "REST"
    "7"  : "BOTH_MI_STIM"
    "8"  : "REST_STIM"
    "99" : "BLOCK_END"

hiamp:
  gtec_root               : "D:/Documentos/gtec/gNEEDaccessClientAPI"
  acquisition_channels    : 16
  reference_channel       : 16
  drop_reference_channel  : true
  reference_mode          : "car"
  chunk                   : 10

debug_plot:
  enabled          : true
  # Dashboard secundária do experimentador. A inferência continua na taxa normal;
  # apenas a GUI é atualizada mais devagar para permanecer leve e responsiva.
  plot_hz          : 5.0      # só a GUI; decoder continua na taxa normal

# Limites heurísticos. Ajuste a unidade conforme o stream real (g.HIamp: conferir).
quality:
  unit: "uV"
  peak_to_peak_limit: 200.0
  flat_std_limit: 0.01
  max_line_noise_ratio: 0.25
  max_high_frequency_ratio: 0.35
  max_robust_z: 8.0
  max_bad_window_fraction: 0.20

# Transmissor ANT Neuro externo: a taxa deve ser configurada também no streamer.
eego:
  signal_name: null       # descobrir pela interface; não pressupõe nome/serial
  signal_type: "EEG"
  fs_hz: 500.0
  n_channels: 29          # quantidade total publicada, incluindo auxiliares se houver
  receive_channels: []   # [] grava todos; exemplo [1, 2, 3] ou nomes (receive_by: name)
  receive_by: "index"
  index_base: 1
  unit: "auto"           # lê metadados; se ausentes, informe uV, mV ou V
